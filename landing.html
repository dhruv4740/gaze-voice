<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gaze Voice</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #0f1115; color: #e6e8eb; font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Inter, sans-serif; }
      header { padding: 20px 32px; font-weight: 600; letter-spacing: .02em; }
      main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 24px 48px; gap: 28px; }
      h1 { margin: 0; max-width: 18ch; font-size: clamp(34px, 5.5vw, 60px); line-height: 1.1; font-weight: 700; }
      .try { display: inline-block; padding: 14px 36px; border-radius: 10px; background: #2dd4bf; color: #0f1115; font-weight: 600; font-size: 18px; text-decoration: none; border: 2px solid transparent; }
      .try:hover, .try:focus-visible { border-color: #e6e8eb; outline: none; }
      ul { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; list-style: none; margin: 8px 0 0; padding: 0; }
      li { padding: 12px 18px; border: 1px solid #2a2e36; border-radius: 10px; background: #181b21; color: #8b919a; font-size: 15px; }
      footer { padding: 20px 32px; text-align: center; color: #8b919a; font-size: 14px; }
      footer a { color: #8b919a; }
    </style>
  </head>
  <body>
    <header>Gaze Voice</header>
    <main>
      <h1>Speech for people who cannot speak, using only a webcam.</h1>
      <a class="try" href="/?mode=mouse">Try it</a>
      <ul>
        <li>No special hardware</li>
        <li>Video never leaves the browser</li>
        <li>Free</li>
      </ul>
    </main>
    <footer>Caregiver on a phone? <a href="/caregiver.html">Open the caregiver page</a></footer>
  </body>
</html>
